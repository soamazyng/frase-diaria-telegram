name: CI/CD develop -> main

# Só push em develop, nunca pull_request/pull_request_target: o fluxo não
# pode depender de um evento de PR produzido pelo token padrão do Actions,
# que tem regras próprias de disparo e aprovação (ticket 17; spec, 4.11).
#
# Um único workflow, quatro jobs encadeados — a proposta técnica da spec é
# "encadear criação/localização de PR e CI/CD no próprio workflow de push"
# (4.11), evitando reconsultar o PR duas vezes em arquivos separados:
#   garantir-pr -> verificar -> construir -> publicar
on:
  push:
    branches:
      - develop

# Negado por padrão no topo: um bloco `permissions:` de job SUBSTITUI o do
# topo para aquele job, em vez de somar — a elevação real mora só em cada job
# (exercitado ao vivo no ticket 17: `contents: read` só no topo não bastava).
permissions: {}

jobs:
  garantir-pr:
    name: Garantir PR develop -> main
    runs-on: ubuntu-latest
    permissions:
      # contents: read é o piso: mesmo sem checkout, `gh pr list`/`gh pr
      # create` resolvem metadados do repositório (a branch padrão) via
      # GraphQL, e sem esta permissão a chamada falha com "Resource not
      # accessible by integration" (exercitado ao vivo no ticket 17).
      contents: read
      pull-requests: write
    outputs:
      numero-pr: ${{ steps.pr.outputs.numero }}
    steps:
      # Sem actions/checkout: gh compara os refs remotamente, e nenhum passo
      # aqui precisa do conteúdo do repositório — menos superfície, nenhuma
      # credencial de git persistida à toa.
      - name: Garantir que existe um PR aberto develop -> main
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          numero="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -n "$numero" ]; then
            echo "Já existe um PR aberto entre develop e main (#$numero); o push atual entra nele."
            echo "numero=$numero" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if saida="$(gh pr create \
            --base main \
            --head develop \
            --title 'develop -> main' \
            --body 'PR automático (ticket 17). Testes, build e publicação em produção rodam a partir de develop neste mesmo workflow (ticket 18), antes deste merge; o merge continua manual (spec, 4.11).' \
            2>&1)"; then
            echo "$saida"
            numero="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
            echo "numero=$numero" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "No commits between" e "already exists" são os dois desfechos
          # esperados sem PR novo: nenhuma diferença para main, ou uma
          # corrida com outra execução deste mesmo workflow. Qualquer outra
          # falha propaga de verdade.
          if echo "$saida" | grep -qiE "no commits between|already exists"; then
            echo "$saida"
            echo "Nada a fazer: sem diferenças para main, ou PR já criado por outra execução."
            echo "numero=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$saida" >&2
          exit 1

  # Testes, análise estática e validação SAM contra o SHA imutável do push
  # (spec 4.11, passo 2; AC20). Falha aqui impede os jobs seguintes por
  # `needs:` — nenhum artefato chega a ser construído nem publicado.
  verificar:
    name: Testes, análise estática e validação SAM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Seguro cancelar: nenhum job daqui até "construir" muta nada fora do
      # runner efêmero. Um push novo cancela a verificação do push anterior
      # em vez de esperar — "apenas trabalhos sem mutação podem ser
      # cancelados livremente" (checklist do ticket 18).
      group: verificar-frase-diaria-${{ github.ref }}
      cancel-in-progress: true
    env:
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: make instalar
        run: make instalar

      - name: make verificar (lint + testes)
        run: make verificar

      - name: make validar-sam
        # Não exige credencial AWS: cfn-lint roda localmente. Exercitado ao
        # vivo sem nenhuma credencial no ambiente antes deste workflow
        # existir, para não conceder OIDC a um job que não precisa dele.
        run: make validar-sam

  # Constrói o artefato exatamente uma vez, identificado pelo SHA do job (via
  # o nome do artefato do Actions) e por um checksum próprio — "publicar
  # exatamente o artefato avaliado" (spec 4.11, passo 3).
  construir:
    name: Construir artefato
    needs: verificar
    runs-on: ubuntu-latest
    concurrency:
      group: construir-frase-diaria-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      checksum: ${{ steps.checksum.outputs.valor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: make construir-app
        env:
          SAM_CLI_TELEMETRY: "0"
        run: make construir-app

      - name: Calcular checksum do artefato
        id: checksum
        run: |
          set -euo pipefail
          raiz=".aws-sam/build"
          soma="$(find "$raiz" -type f ! -name CHECKSUM.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "$soma" > "$raiz/CHECKSUM.txt"
          echo "Checksum do artefato: $soma"
          echo "valor=$soma" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artefato-${{ github.sha }}
          path: .aws-sam/build
          # 14 dias, não 1: o artefato não serve só ao job "publicar" deste
          # mesmo run — a recuperação (ticket 19; spec, 4.12) precisa
          # rebaixar para uma publicação saudável anterior "sem reconstruir
          # dependências", o que só é possível enquanto o artefato daquele
          # SHA ainda existir. Mesmo prazo da retenção de logs já usada no
          # projeto (RetencaoDeLogsEmDias, infra/aplicacao.yaml) — o
          # histórico do produto em si continua vivendo só no DynamoDB.
          retention-days: 14
          if-no-files-found: error

  # Publica exatamente o artefato construído acima, dentro da exclusão mútua
  # de produção (spec 4.11, passos 4-8; AC21, AC22).
  publicar:
    name: Publicar em produção
    needs: [construir, garantir-pr]
    runs-on: ubuntu-latest
    environment: producao
    concurrency:
      # Grupo fixo (não por ref): só existe uma produção. Sem
      # cancel-in-progress — este job muta a stack de aplicação; cancelar no
      # meio deixaria um deploy pela metade. Um push novo enfileira atrás
      # deste, nunca o interrompe (checklist do ticket 18).
      group: producao-frase-diaria
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # só este job assume papel AWS (AGENTS.md)
      pull-requests: read
      deployments: write
      actions: read # baixar o artefato de um SHA anterior (recuperação, ticket 19)
      issues: write # registrar diagnóstico no GitHub quando não houver versão recuperável (ticket 19)
    env:
      SAM_CLI_TELEMETRY: "0"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STACK_APLICACAO: frase-diaria-app
      BUCKET_ARTEFATOS: ${{ vars.AWS_BUCKET_ARTEFATOS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make publicar-app-artefato` chama `uvx` (via a variável SAM do
      # Makefile) — sem este passo, ausente aqui até a primeira execução
      # real do pipeline expor o erro (`uvx: not found`), nenhuma versão do
      # SAM CLI existe no runner deste job.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artefato-${{ github.sha }}
          path: .aws-sam/build

      - name: Conferir checksum do artefato baixado
        run: |
          set -euo pipefail
          raiz=".aws-sam/build"
          esperado="$(cat "$raiz/CHECKSUM.txt")"
          obtido="$(find "$raiz" -type f ! -name CHECKSUM.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          if [ "$esperado" != "$obtido" ]; then
            echo "::error::checksum do artefato baixado não confere com o calculado em 'construir' (esperado $esperado, obtido $obtido)"
            exit 1
          fi
          echo "Checksum confere: $obtido"

      - name: Reconsultar PR aberto, SHA atual e base de main
        id: checar-atualidade
        # Depois de esperar a exclusão mútua (o "concurrency:" do job acima),
        # nunca presumir que este SHA ainda é o candidato válido — outro push
        # pode ter avançado develop enquanto este job estava na fila
        # (spec 4.11: "reconsultar PR aberto e SHA atual"; AC22).
        run: |
          set -euo pipefail

          shaAtual="$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)"
          if [ "$shaAtual" != "$GITHUB_SHA" ]; then
            echo "SHA $GITHUB_SHA não é mais o HEAD de develop (atual: $shaAtual)."
            echo "Publicação superada por um push mais recente; encerrando sem publicar."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          abertos="$(gh pr list --base main --head develop --state open --json number --jq 'length')"
          if [ "$abertos" -eq 0 ]; then
            echo "Não há mais PR aberto develop -> main; encerrando sem publicar."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # "Antes de publicar, exige-se que o conteúdo de develop inclua a
          # base relevante de main" (checklist do ticket 18). "Base
          # relevante" não é o HEAD literal de main: a spec (4.11) propõe
          # merge commit preservando o histórico de dev, e um commit de
          # merge nunca passa pelo pipeline — comparar contra ele quebra
          # sempre que um PR é mergeado (achado ao vivo em 2026-09-08, ver
          # docs/20). Quando o HEAD de main tem dois parents (é um commit
          # de merge), o segundo parent é a ponta de develop realmente
          # testada e incorporada; é contra ela que develop precisa
          # continuar à frente ou igual.
          shaMain="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          qtdPais="$(gh api "repos/$GH_REPO/commits/$shaMain" --jq '.parents | length')"
          if [ "$qtdPais" -eq 2 ]; then
            shaBaseDeMain="$(gh api "repos/$GH_REPO/commits/$shaMain" --jq '.parents[1].sha')"
          else
            shaBaseDeMain="$shaMain"
          fi

          status="$(gh api "repos/$GH_REPO/compare/$shaBaseDeMain...develop" --jq .status)"
          case "$status" in
            identical|ahead) ;;
            *)
              echo "::error::develop não inclui a base relevante de main ($shaBaseDeMain, status da comparação: $status); publicação bloqueada."
              exit 1
              ;;
          esac

          echo "publicar=sim" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciais AWS (OIDC)
        if: steps.checar-atualidade.outputs.publicar == 'sim'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          # O ARN fica nas variáveis do repositório para não versionar
          # identificadores operacionais. A trust policy exige este
          # environment e também o ref exato de develop.
          role-to-assume: ${{ vars.AWS_ROLE_PUBLICACAO_ARN }}
          aws-region: us-east-1
          role-session-name: github-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Preservar artefato imutável para recuperação
        if: steps.checar-atualidade.outputs.publicar == 'sim'
        env:
          CHECKSUM_DO_ARTEFATO: ${{ needs.construir.outputs.checksum }}
        run: |
          set -euo pipefail
          if [ -z "$BUCKET_ARTEFATOS" ]; then
            echo "::error::a variável AWS_BUCKET_ARTEFATOS não está configurada"
            exit 1
          fi
          (cd .aws-sam/build && zip -qr /tmp/artefato-publicacao.zip .)
          chave="recuperacao/$GITHUB_REPOSITORY_ID/$GITHUB_SHA.zip"
          checksumExistente="$(aws s3api head-object --bucket "$BUCKET_ARTEFATOS" \
            --key "$chave" --query 'Metadata.checksum' --output text 2>/dev/null || true)"
          if [ "$checksumExistente" = "$CHECKSUM_DO_ARTEFATO" ]; then
            exit 0
          fi
          if [ -n "$checksumExistente" ] && [ "$checksumExistente" != "None" ]; then
            echo "::error::já existe artefato diferente para este SHA"
            exit 1
          fi
          if ! aws s3api put-object --bucket "$BUCKET_ARTEFATOS" --key "$chave" \
            --body /tmp/artefato-publicacao.zip --server-side-encryption AES256 \
            --metadata "checksum=$CHECKSUM_DO_ARTEFATO" --if-none-match '*' \
            >/dev/null 2>&1; then
            echo "::error::não foi possível preservar o artefato imutável"
            exit 1
          fi

      - name: Registrar publicação em andamento
        if: steps.checar-atualidade.outputs.publicar == 'sim'
        id: implantacao
        env:
          CHECKSUM_DO_ARTEFATO: ${{ needs.construir.outputs.checksum }}
        run: |
          set -euo pipefail
          corpo="$(jq -n --arg ref "$GITHUB_SHA" --arg descricao "checksum sha256:$CHECKSUM_DO_ARTEFATO" \
            '{ref: $ref, environment: "producao", auto_merge: false, required_contexts: [], description: $descricao}')"
          id="$(echo "$corpo" | gh api --method POST "repos/$GH_REPO/deployments" --input - --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GH_REPO/deployments/$id/statuses" \
            -f state=in_progress -f description="sam deploy em andamento"
          # Criar aqui, com estado "success" mais adiante, é o que invalida a
          # elegibilidade de merge da candidata anterior: por padrão a API de
          # Deployments marca a implantação "success" anterior deste mesmo
          # ambiente como "inactive" ao registrar uma nova (checklist do
          # ticket 18: "publicação em andamento é registrada e a
          # elegibilidade de merge da candidata anterior é invalidada").

      - name: sam deploy (artefato já construído)
        if: steps.checar-atualidade.outputs.publicar == 'sim'
        run: make publicar-app-artefato
        env:
          VERSAO: ${{ github.sha }}

      - name: Verificar saúde, versão, dependências, webhook e agendamento
        # always(): mesmo que "sam deploy" tenha falhado, o CloudFormation
        # pode ter feito rollback nativo sozinho para uma versão anterior
        # saudável (exercitado ao vivo no ticket 18, incidente do
        # ScheduleV2) — este diagnóstico precisa rodar contra o que estiver
        # ativo agora, não só no caminho feliz (spec, 4.12: "falha de
        # deploy... verificando também rollback nativo da infraestrutura").
        if: always() && steps.checar-atualidade.outputs.publicar == 'sim'
        id: diagnostico
        uses: ./.github/actions/diagnosticar-publicacao
        with:
          versao-esperada: ${{ github.sha }}

      # A partir daqui, ticket 19 (spec, 4.12): se o diagnóstico acima
      # reprovou — deploy falho sem rollback nativo suficiente, ou deploy
      # bem-sucedido mas diagnóstico ruim —, recupera a publicação saudável
      # anterior à tentativa em vez de deixar a produção quebrada.
      - name: Localizar última publicação saudável
        if: always() && steps.diagnostico.outcome == 'failure'
        id: localizar-recuperacao
        env:
          ID_DA_IMPLANTACAO: ${{ steps.implantacao.outputs.id }}
        run: |
          set -euo pipefail
          # "Dois marcos... consultáveis: a publicação saudável anterior à
          # tentativa" (checklist do ticket 19) — sem manifesto próprio: a
          # API de Deployments do ticket 18 já registra exatamente isso.
          # Percorre as implantações mais recentes primeiro (ordem padrão da
          # API), pulando a desta própria tentativa, até achar a última com
          # status "success".
          shaRecuperacao=""
          checksumRecuperacao=""
          for id in $(gh api "repos/$GH_REPO/deployments?environment=producao&per_page=20" --jq '.[].id'); do
            if [ "$id" = "$ID_DA_IMPLANTACAO" ]; then
              continue
            fi
            estado="$(gh api "repos/$GH_REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')"
            if [ "$estado" = "success" ]; then
              implantacao="$(gh api "repos/$GH_REPO/deployments/$id")"
              checksum="$(echo "$implantacao" | jq -r '.description // empty' \
                | sed -n 's/^checksum sha256:\([0-9a-f]\{64\}\)$/\1/p')"
              if [ -n "$checksum" ]; then
                shaRecuperacao="$(echo "$implantacao" | jq -r .sha)"
                checksumRecuperacao="$checksum"
                break
              fi
            fi
          done
          if [ -z "$shaRecuperacao" ]; then
            echo "Nenhuma publicação 'success' anterior encontrada — sem versão para recuperar (spec, 4.12: 'primeiro deploy sem versão anterior')."
          else
            echo "Publicação saudável anterior encontrada: $shaRecuperacao"
          fi
          echo "sha=$shaRecuperacao" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksumRecuperacao" >> "$GITHUB_OUTPUT"

      - name: Obter artefato da publicação saudável anterior
        if: always() && steps.localizar-recuperacao.outputs.sha != ''
        id: obter-recuperacao
        uses: ./.github/actions/obter-artefato
        with:
          sha: ${{ steps.localizar-recuperacao.outputs.sha }}
          checksum: ${{ steps.localizar-recuperacao.outputs.checksum }}

      - name: Recuperar publicação saudável anterior
        # always(): sem isso, o GitHub Actions insere um success() implícito
        # em qualquer `if:` que não use always()/failure()/cancelled()
        # explicitamente — e como o passo "diagnostico" anterior já falhou
        # (é exatamente por isso que chegamos aqui), esse success() implícito
        # bloquearia este passo mesmo com o SHA de recuperação já achado.
        # Achado ao vivo (ticket 19: teste de fogo real) — o passo ficava
        # "skipped" mesmo com steps.localizar-recuperacao.outputs.sha
        # preenchido, e a cadeia caía direto em desabilitar o agendamento.
        if: always() && steps.obter-recuperacao.outputs.disponivel == 'sim'
        id: recuperar
        env:
          SHA_RECUPERACAO: ${{ steps.localizar-recuperacao.outputs.sha }}
          CHECKSUM_RECUPERACAO: ${{ steps.localizar-recuperacao.outputs.checksum }}
        run: |
          set -euo pipefail
          corpo="$(jq -n --arg ref "$SHA_RECUPERACAO" --arg descricao "checksum sha256:$CHECKSUM_RECUPERACAO" \
            '{ref: $ref, environment: "producao", auto_merge: false, required_contexts: [], description: $descricao}')"
          idImplantacaoRecuperacao="$(echo "$corpo" | gh api --method POST "repos/$GH_REPO/deployments" --input - --jq .id)"
          gh api --method POST "repos/$GH_REPO/deployments/$idImplantacaoRecuperacao/statuses" \
            -f state=in_progress -f description="redeploy de recuperação em andamento"
          echo "id_implantacao=$idImplantacaoRecuperacao" >> "$GITHUB_OUTPUT"

          if VERSAO="$SHA_RECUPERACAO" make publicar-app-artefato; then
            echo "sucesso=sim" >> "$GITHUB_OUTPUT"
          else
            echo "::error::sam deploy da recuperação (para $SHA_RECUPERACAO) falhou"
            gh api --method POST "repos/$GH_REPO/deployments/$idImplantacaoRecuperacao/statuses" \
              -f state=failure -f description="sam deploy de recuperação falhou"
            echo "sucesso=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Verificar publicação recuperada
        # always(): mesmo motivo do passo "Recuperar" acima.
        if: always() && steps.recuperar.outputs.sucesso == 'sim'
        id: diagnostico-recuperacao
        uses: ./.github/actions/diagnosticar-publicacao
        with:
          versao-esperada: ${{ steps.localizar-recuperacao.outputs.sha }}

      - name: Registrar resultado da recuperação
        if: always() && steps.recuperar.outputs.id_implantacao != ''
        env:
          ID_IMPLANTACAO_RECUPERACAO: ${{ steps.recuperar.outputs.id_implantacao }}
          DESFECHO_DIAGNOSTICO_RECUPERACAO: ${{ steps.diagnostico-recuperacao.outcome }}
        run: |
          set -euo pipefail
          estado=failure
          if [ "$DESFECHO_DIAGNOSTICO_RECUPERACAO" = "success" ]; then
            estado=success
          fi
          gh api --method POST "repos/$GH_REPO/deployments/$ID_IMPLANTACAO_RECUPERACAO/statuses" \
            -f state="$estado" -f description="diagnóstico pós-recuperação: $DESFECHO_DIAGNOSTICO_RECUPERACAO"

      # Nenhuma recuperação foi possível (sem versão anterior) ou a
      # recuperação também não passou no diagnóstico: "desabilitar novos
      # envios quando não houver versão operacional verificável" (spec,
      # 4.12) e registrar o diagnóstico no GitHub para procedimento manual.
      - name: Desabilitar agendamento diário (sem versão operacional verificável)
        if: always() && steps.diagnostico.outcome == 'failure' && steps.diagnostico-recuperacao.outcome != 'success'
        id: desabilitar
        run: |
          set -euo pipefail
          nome="frase-diaria-agendador-diario"
          aws scheduler get-schedule --name "$nome" \
            | jq 'del(.CreationDate, .LastModificationDate, .Arn) | .State = "DISABLED"' \
            > /tmp/agendamento-desabilitado.json
          aws scheduler update-schedule --name "$nome" --cli-input-json file:///tmp/agendamento-desabilitado.json
          echo "Agendamento diário desabilitado: nenhuma versão operacional verificável."

      - name: Registrar diagnóstico no GitHub (sem versão operacional verificável)
        if: always() && steps.diagnostico.outcome == 'failure' && steps.diagnostico-recuperacao.outcome != 'success'
        env:
          SHA_TENTATIVA: ${{ github.sha }}
          SHA_RECUPERACAO_TENTADA: ${{ steps.localizar-recuperacao.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SHA_RECUPERACAO_TENTADA" ]; then
            motivo="a recuperação automática para $SHA_RECUPERACAO_TENTADA também falhou"
          else
            motivo="nenhuma publicação 'success' anterior foi encontrada para recuperar"
          fi
          gh issue create --repo "$GH_REPO" \
            --title "Publicação $SHA_TENTATIVA falhou; sem versão operacional verificável" \
            --body "O diagnóstico pós-publicação reprovou o SHA $SHA_TENTATIVA e $motivo. O agendamento diário foi desabilitado. Procedimento manual: 'git checkout <sha-válido>' seguido de 'make publicar-app VERSAO=<sha-válido>' publica esse commit específico a partir de um checkout local; reabilitar o agendamento depois é responsabilidade manual (aws scheduler update-schedule ou console). Logs desta tentativa: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID."

      - name: Registrar resultado da publicação
        if: always() && steps.implantacao.outputs.id != ''
        env:
          DESFECHO_DO_DIAGNOSTICO: ${{ steps.diagnostico.outcome }}
          ID_DA_IMPLANTACAO: ${{ steps.implantacao.outputs.id }}
        run: |
          set -euo pipefail
          # "Sucesso é registrado somente no SHA efetivamente publicado e
          # ainda atual no PR" (checklist do ticket 18; AC21) — por isso esta
          # reconsulta roda de novo aqui, e não apenas antes do deploy.
          #
          # Falha real de diagnóstico -> failure (reprova a publicação,
          # checklist do ticket 18). Diagnóstico bom mas SHA já superado por
          # push mais recente -> inactive, não success: a implantação foi
          # saudável, só não é mais a candidata atual (AC22). Só "failure"
          # derruba o check deste job; "inactive" continua um check verde
          # para este commit, coerente com o que de fato aconteceu nele.
          if [ "$DESFECHO_DO_DIAGNOSTICO" != "success" ]; then
            estado=failure
          else
            shaAtual="$(gh api "repos/$GH_REPO/git/ref/heads/develop" --jq .object.sha)"
            if [ "$shaAtual" = "$GITHUB_SHA" ]; then
              estado=success
            else
              estado=inactive
              echo "SHA $GITHUB_SHA não é mais o HEAD de develop ($shaAtual); publicação saudável, marcada inativa por ter sido superada."
            fi
          fi
          gh api --method POST "repos/$GH_REPO/deployments/$ID_DA_IMPLANTACAO/statuses" \
            -f state="$estado" -f description="diagnóstico pós-publicação: $DESFECHO_DO_DIAGNOSTICO"
          [ "$estado" != "failure" ]
