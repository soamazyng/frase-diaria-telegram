AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Aplicação do frase-diaria-telegram: entrada HTTP, worker de entrega e logs.
  Republicar esta stack não toca na stack de dados, que guarda o histórico.

Parameters:
  Prefixo:
    Type: String
    Default: frase-diaria
    Description: Prefixo dos nomes dos recursos; precisa casar com a stack de dados.
  Versao:
    Type: String
    Default: desenvolvimento
    Description: >
      Identificador da versão publicada, devolvido por GET /health. O pipeline
      injeta aqui o SHA do commit avaliado.
  RetencaoDeLogsEmDias:
    Type: Number
    Default: 14
    Description: Retenção dos logs técnicos. Não substituem o histórico, que vive no DynamoDB.

Globals:
  Function:
    Runtime: python3.13
    # 128 MB é o mínimo; o trabalho é de E/S, não de CPU.
    MemorySize: 128
    Timeout: 30
    Architectures:
      - arm64
    Environment:
      Variables:
        VERSAO_DA_APLICACAO: !Ref Versao
        TABELA_ESTADO:
          Fn::ImportValue: !Sub "${Prefixo}-TabelaNome"
        FUNCAO_WORKER: !Sub "${Prefixo}-worker"

Resources:
  # Stage $default não prefixa o caminho: GET /health chega ao FastAPI como
  # /health. Uma REST API com stage Prod entregaria /Prod/health e daria 404.
  Http:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub "${Prefixo}-http"
          version: "1.0"
        paths:
          /telegram/webhook:
            post:
              responses:
                "200":
                  description: reconhecido
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Funcao.Arn}/invocations"
          /health:
            get:
              responses:
                "200":
                  description: saúde e versão
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Funcao.Arn}/invocations"

  # A fronteira HTTP: valida, registra o pedido e acorda o worker. Nunca entrega
  # a frase — isso exigiria trabalho depois de responder ao Telegram.
  Funcao:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${Prefixo}-http"
      CodeUri: ..
      Handler: frase_diaria.infraestrutura.http.lambda_handler.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - &acessoATabela
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:TransactGetItems
              Resource:
                - Fn::ImportValue: !Sub "${Prefixo}-TabelaArn"
                - !Sub
                  - "${Arn}/index/*"
                  - Arn:
                      Fn::ImportValue: !Sub "${Prefixo}-TabelaArn"
            - &leituraDosSegredos
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Prefixo}/*"
            - &decifrarSegredos
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            # Acordar o worker: só esta função, nada além dela.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefixo}-worker"
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref Http
            Path: /health
            Method: GET
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref Http
            Path: /telegram/webhook
            Method: POST

  # O worker: lê o pedido da persistência e entrega. Sem gatilho HTTP — só
  # invocação assíncrona e, a partir do ticket 14, o agendador.
  Worker:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "${Prefixo}-worker"
      CodeUri: ..
      Handler: frase_diaria.infraestrutura.worker_handler.handler
      # Mais folgado que a fronteira HTTP: aqui há várias chamadas ao Telegram.
      Timeout: 60
      Policies:
        - Version: "2012-10-17"
          Statement:
            - *acessoATabela
            - *leituraDosSegredos
            - *decifrarSegredos

  # Declarados explicitamente para controlar a retenção. Sem isso a Lambda cria
  # os grupos com retenção infinita, que crescem e passam a custar.
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Prefixo}-http"
      RetentionInDays: !Ref RetencaoDeLogsEmDias

  LogGroupWorker:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Prefixo}-worker"
      RetentionInDays: !Ref RetencaoDeLogsEmDias

Outputs:
  UrlHealth:
    Description: URL pública do diagnóstico.
    Value: !Sub "https://${Http}.execute-api.${AWS::Region}.${AWS::URLSuffix}/health"
  UrlWebhook:
    Description: URL a registrar no Telegram via setWebhook.
    Value: !Sub "https://${Http}.execute-api.${AWS::Region}.${AWS::URLSuffix}/telegram/webhook"
  VersaoPublicada:
    Value: !Ref Versao
