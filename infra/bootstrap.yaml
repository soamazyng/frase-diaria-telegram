AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Confiança OIDC entre GitHub Actions e a AWS: um provedor de identidade e dois
  papéis, sem nenhuma chave de longo prazo guardada no GitHub (spec, 4.10;
  AC28). Publicada UMA vez, por uma identidade AWS já autorizada — um pipeline
  sem esta confiança não teria como criá-la sozinho. Não depende das stacks de
  dados/aplicação e não as modifica.

Parameters:
  Prefixo:
    Type: String
    Default: frase-diaria
    Description: Prefixo dos nomes dos recursos; casa com as stacks de dados e aplicação.
  ProprietarioGitHub:
    Type: String
    Default: soamazyng
    Description: "Dono (usuário/organização) do repositório no GitHub."
  IdDoProprietarioGitHub:
    Type: String
    Default: "443219"
    Description: >
      ID numérico imutável do dono no GitHub (`gh api users/<dono> --jq .id`).
      Repositórios criados depois de 2026-07-15 emitem o claim `sub` do OIDC
      no formato imutável "repo:DONO@ID-DONO/REPO@ID-REPO:ref:...", não mais
      "repo:DONO/REPO:ref:...". Confirmado contra um token OIDC real emitido
      pelo GitHub nesta primeira execução do pipeline (ticket 18) — a
      primeira tentativa, com o formato antigo, falhou com "Not authorized
      to perform sts:AssumeRoleWithWebIdentity" contra a AWS real.
  NomeDoRepositorio:
    Type: String
    Default: frase-diaria-telegram
    Description: "Nome do repositório no GitHub, sem o dono."
  IdDoRepositorio:
    Type: String
    Default: "1359588301"
    Description: >
      ID numérico imutável do repositório (`gh api repos/<dono>/<repo> --jq .id`).
      Mesma nuance de IdDoProprietarioGitHub.
  StackGerenciadaPeloSAM:
    Type: String
    Default: aws-sam-cli-managed-default
    Description: >
      Stack que `sam deploy --resolve-s3` cria/usa para hospedar o bucket de
      artefatos, quando nenhum `--s3-bucket` é dado explicitamente. Não é
      exclusiva deste projeto — é compartilhada por qualquer app SAM na
      conta que use `--resolve-s3` sem bucket próprio —, mas hoje é a única
      (conta de projeto único). Criada no ticket 03 (publicação manual, com
      `perfil-padrao`, permissões amplas); o papel de publicação do CI/CD
      não tinha acesso a ela, e o primeiro `sam deploy` real do ticket 18
      falhou com AccessDenied em `cloudformation:CreateChangeSet` sobre
      esta stack até este parâmetro ser adicionado.
  BucketGerenciadoPeloSAM:
    Type: String
    Default: aws-sam-cli-managed-default-samclisourcebucket-afhcijvri5mn
    Description: "Nome do bucket S3 dentro da stack acima (Output SourceBucket, conferido ao vivo)."
  BranchDePublicacao:
    Type: String
    Default: develop
    Description: >
      Branch cujo push aciona a publicação (spec, 4.11: "o gatilho principal é
      push remoto para dev"). Só workflows rodando a partir desta branch podem
      assumir o papel de publicação.
  BranchDeInfraestrutura:
    Type: String
    Default: main
    Description: >
      Branch onde vive o workflow periódico de reconciliação de publicações
      (ticket 20) — GitHub só dispara `schedule` a partir do branch padrão.

Resources:
  # AWS já confia nas CAs que assinam os tokens do GitHub; o thumbprint é
  # exigido pelo esquema do CloudFormation mas não é mais validado contra ele
  # para provedores conhecidos (verificado: skill aws-iam, "Verified Edge
  # Cases"). Mantido pelo valor documentado da GitHub por precaução.
  ProvedorOIDCDoGitHub:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: projeto
          Value: !Ref Prefixo

  # Assumido pelo workflow de push em `develop` (tickets 17/18) para publicar
  # a stack de aplicação. Nunca toca a stack de dados — publicar/republicar a
  # aplicação não deve nem precisa alcançar o histórico (spec, 4.9).
  PapelDePublicacao:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefixo}-publicacao"
      Description: !Sub "CI/CD (${ProprietarioGitHub}/${NomeDoRepositorio}@${BranchDePublicacao}): publica a stack de aplicação."
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ProvedorOIDCDoGitHub
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # `aud` sempre `sts.amazonaws.com`; `sub` é o valor exato (não
              # precisa de StringLike/wildcard) — restringe a exatamente este
              # repositório E esta branch (AC28: proprietário, repositório e
              # contexto de execução). Formato imutável baseado em IDs (não
              # "repo:DONO/REPO:ref:..."): ver IdDoProprietarioGitHub acima.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${ProprietarioGitHub}@${IdDoProprietarioGitHub}/${NomeDoRepositorio}@${IdDoRepositorio}:ref:refs/heads/${BranchDePublicacao}"
      Policies:
        - PolicyName: PublicarStackDeAplicacao
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SAM processa o Transform antes de aplicar o changeset; sem
              # isto, todo `sam deploy` seria recusado já na primeira chamada.
              - Sid: TransformSAM
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: GerenciarAStackDeAplicacao
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:TagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefixo}-app/*"
              - Sid: FuncoesLambdaDaAplicacao
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefixo}-*"
              - Sid: ApiGatewayHttpExistente
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                Resource:
                  # ARN de API Gateway v2 não carrega o id da conta — o padrão
                  # /apis* casaria com qualquer API HTTP da conta/região, não
                  # só a deste projeto (achado do security-review). A condição
                  # de tag reduz o alcance a recursos que o próprio
                  # CloudFormation já marca com o nome desta stack; sem ela,
                  # este seria um curinga sem redução de escopo (AGENTS.md
                  # exige condição para todo curinga).
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/aws:cloudformation:stack-name: !Sub "${Prefixo}-app"
              - Sid: ApiGatewayHttpCriacaoDeSubRecursos
                Effect: Allow
                Action:
                  - apigateway:POST
                Resource:
                  # A API HTTP já existe (publicada no ticket 03); todo POST
                  # esperado daqui em diante cria sub-recursos (rota,
                  # integração, estágio) sob ela, não uma API nova — mas o
                  # suporte de AWS::ResourceTag do API Gateway a essa operação
                  # específica não foi verificado ao vivo. Residual aceito
                  # deliberadamente, não escondido: ticket 18 deve confirmar
                  # contra o pipeline real e apertar esta condição se o
                  # serviço suportar.
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*"
              - Sid: LogsDaAplicacao
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:ListTagsForResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefixo}-*"
              - Sid: AgendamentosDaAplicacao
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:TagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${Prefixo}-*"
              - Sid: PapeisDeExecucaoDaAplicacao
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:PassRole
                Resource:
                  # Só os papéis de execução que o SAM cria/gerencia DENTRO da
                  # stack de aplicação — nunca o papel de publicação nem o de
                  # infraestrutura, e nunca um papel fora deste prefixo
                  # (PassRole aberto + deploy de Lambda seria escalonamento de
                  # privilégio; verificado na skill aws-iam).
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Prefixo}-app-*"
              - Sid: StackDoBucketGerenciadoPeloSAM
                Effect: Allow
                Action:
                  # `sam deploy --resolve-s3` verifica/usa esta stack a cada
                  # publicação, mesmo sem alteração real nela — por isso
                  # precisa do fluxo de changeset, não só de leitura. Nunca
                  # CreateStack/UpdateStack: a stack já existe (ticket 03) e
                  # este papel não deve poder recriá-la nem alterá-la, só
                  # confirmar seu estado atual.
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackGerenciadaPeloSAM}/*"
              - Sid: BucketDeArtefatosGerenciadoPeloSAM
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${BucketGerenciadoPeloSAM}"
                  - !Sub "arn:${AWS::Partition}:s3:::${BucketGerenciadoPeloSAM}/*"

  # Assumido pelo workflow periódico de reconciliação de publicações (ticket
  # 20, ainda não construído): por enquanto só leitura, porque a lógica de
  # recuperação em si ainda não existe. Estender esta policy quando o ticket
  # 20 definir exatamente que ação de recuperação ela precisa executar — não
  # conceder de antemão o que ainda não tem uso concreto.
  PapelDeInfraestrutura:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefixo}-infraestrutura"
      Description: !Sub "CI/CD (${ProprietarioGitHub}/${NomeDoRepositorio}@${BranchDeInfraestrutura}): inspeciona o estado da publicação."
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref ProvedorOIDCDoGitHub
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # Mesmo formato imutável do papel de publicação, acima.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${ProprietarioGitHub}@${IdDoProprietarioGitHub}/${NomeDoRepositorio}@${IdDoRepositorio}:ref:refs/heads/${BranchDeInfraestrutura}"
      Policies:
        - PolicyName: InspecionarPublicacao
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefixo}-app/*"
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefixo}-*"

Outputs:
  ProvedorOIDCArn:
    Value: !Ref ProvedorOIDCDoGitHub
    Export:
      Name: !Sub "${Prefixo}-ProvedorOIDCArn"
  PapelDePublicacaoArn:
    Description: Cole em `role-to-assume` no workflow de publicação (não é segredo).
    Value: !GetAtt PapelDePublicacao.Arn
    Export:
      Name: !Sub "${Prefixo}-PapelDePublicacaoArn"
  PapelDeInfraestruturaArn:
    Description: Cole em `role-to-assume` no workflow de reconciliação (não é segredo).
    Value: !GetAtt PapelDeInfraestrutura.Arn
    Export:
      Name: !Sub "${Prefixo}-PapelDeInfraestruturaArn"
